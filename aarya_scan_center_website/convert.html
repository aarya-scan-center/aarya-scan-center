<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Convert Aarya Posters to PNG</title>
</head>
<body>
  <button id="convert">Download all PNG posters</button>

  <script>
    const files = [
      "aarya-full-services-editorial.svg",
      "aarya-full-services-dark-cards.svg",
      "aarya-full-services-lavender-bands.svg",
      "aarya-full-services-split-directory.svg",
      "aarya-full-services-numbered-menu.svg",
      "aarya-whatsapp-services-poster.svg"
    ];

    document.getElementById("convert").addEventListener("click", async () => {
      for (const file of files) {
        const response = await fetch(file);
        const svgText = await response.text();

        const svgBlob = new Blob([svgText], {
          type: "image/svg+xml;charset=utf-8"
        });

        const url = URL.createObjectURL(svgBlob);
        const image = new Image();

        await new Promise((resolve, reject) => {
          image.onload = resolve;
          image.onerror = reject;
          image.src = url;
        });

        const canvas = document.createElement("canvas");
        canvas.width = 1080;
        canvas.height = 1080;

        const context = canvas.getContext("2d");
        context.fillStyle = "#f3eee3";
        context.fillRect(0, 0, 1080, 1080);
        context.drawImage(image, 0, 0, 1080, 1080);

        const pngUrl = canvas.toDataURL("image/png");
        const link = document.createElement("a");

        link.href = pngUrl;
        link.download = file.replace(".svg", ".png");
        link.click();

        URL.revokeObjectURL(url);

        await new Promise(resolve => setTimeout(resolve, 500));
      }
    });
  </script>
</body>
</html>
